services:
  db:
    image: postgres:16-alpine
    container_name: dbagent-db
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5656}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dbagent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dbagent-net
  llm:
    image: vllm/vllm-openai:latest
    container_name: dbagent-llm
    env_file:
      - .env
    command:
      - --model
      - ${LLM_CONTAINER_MODEL_PATH:-/models/llm}
      - --dtype
      - ${LLM_DTYPE:-bfloat16}
      - --host
      - 0.0.0.0
      - --port
      - ${LLM_PORT:-8000}
      - --served-model-name
      - ${LLM_MODEL_NAME:-qwen-3.8-27b}
      - --tensor-parallel-size
      - ${LLM_TENSOR_PARALLEL_SIZE:-1}
      - --gpu-memory-utilization
      - ${LLM_GPU_MEMORY_UTILIZATION:-0.6}
      - --trust-remote-code
    volumes:
      - "${LLM_HOST_MODEL_PATH:-/absolute/path/to/your/llm/model}:${LLM_CONTAINER_MODEL_PATH:-/models/llm}:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities:
                - gpu
              device_ids:
                - "${LLM_GPU_DEVICE_ID:-5}"
    ports:
      - "${LLM_PORT:-8000}:${LLM_PORT:-8000}"
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${LLM_PORT:-8000}/health').read()\""]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks:
      - dbagent-net

volumes:
  postgres_data:
networks:
  dbagent-net:
    name: dbagent-net
