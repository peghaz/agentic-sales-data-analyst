services:
  db:
    image: postgres:16-alpine
    container_name: dbagent-db
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5656}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dbagent}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
